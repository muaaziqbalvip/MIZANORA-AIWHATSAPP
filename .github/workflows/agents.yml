name: 3 - Mizanora Agents (auto, multi-user)
# Every 30 min: read approved users from Firestore → start one job per (user, channel). No admin click, no per-user files.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # Runs every 30 minutes
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.p.outputs.agents }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check that all bot files are in the repo
        run: |
          for f in scripts/plan.js src/plan.js src/cloud.js src/config.js src/index.js scripts/load-config.js package.json; do
            [ -f "$f" ] || { echo "::error::$f repo mein nahi hai. Mizanora-v3-core.zip ki SAARI files upload karein (sirf agents.yml kaafi nahi)."; MISSING=1; }
          done
          [ -z "$MISSING" ] || exit 1
          grep -q '"type": "module"' package.json || { echo '::error::package.json purani hai (type: module nahi). Nayi package.json upload karein.'; exit 1; }
      - run: npm install --no-audit --no-fund firebase-admin
      - id: p
        run: node scripts/plan.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  run:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    concurrency:
      group: agent-${{ matrix.agent }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils
          pip install --user --break-system-packages -q edge-tts && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      - name: Parse agent id (validated)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          [[ "$AGENT" =~ ^[A-Za-z0-9]{20,40}:(whatsapp|telegram|business)$ ]] || { echo "::error::bad agent id"; exit 1; }
          echo "AGENT_UID=${AGENT%%:*}" >> "$GITHUB_ENV"
          echo "CHANNEL=${AGENT##*:}" >> "$GITHUB_ENV"
          echo "MEMORY_DIR=memory_store/${AGENT%%:*}-${AGENT##*:}" >> "$GITHUB_ENV"
      - run: node scripts/load-config.js "$AGENT_UID" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node src/index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAX_RUNTIME_MIN: '340'
          BROWSER_ENABLED: 'false'
